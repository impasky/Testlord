# Render Blueprint — Lordlar Çağı
#
# Telefon tarayıcısından kurulabilir: render.com → New → Blueprint → bu repoyu
# seç. Render bu dosyayı okuyup hem sunucuyu hem PostgreSQL'i kendisi kurar.
#
# Tek servis: API hem oyunu hem arayüzü sunar (SERVE_WEB) ve worker'ı kendi
# içinde çalıştırır (RUN_WORKER). Tek origin olduğu için CORS hiç devreye
# girmiyor; ayrı bir worker servisi ikinci bir ücret demek ve gerekmiyor.
#
# ŞİMDİLİK: ÜCRETSİZ, GEÇİCİ DENEME SUNUCUSU (2026-10-17). Kalıcı yayın
# DigitalOcean'da (docs/05 §2, .do/deploy.template.yaml); oraya geçince bu
# dosyanın işi bitiyor. Ücretsiz katmanın bedeli bilerek kabul edildi:
#   - sunucu 15 dakika istek gelmezse UYUYOR; ilk açılış ~1 dakika. İçindeki
#     worker da duruyor, ama oyuncu dönünce birikmiş işler hemen çözülüyor;
#   - PostgreSQL 30 GÜNDE süresi doluyor, 14 gün sonra VERİSİYLE siliniyor:
#     DigitalOcean'a geçiş ondan önce;
#   - bellek 512 MB: profil resmi sınıflandırıcısı (~100 MB) kapalı, yüklenen
#     resimler yönetici onayına gidiyor.
# Kalıcı Render için: sunucu `standard`, veritabanı `basic-1gb` (docs/05 §2b).

databases:
  # YENİ AD. Eski `lordlar-db` 31 Ağustos'ta ücretsiz açılmıştı; 30 günlük
  # süresi büyük olasılıkla dolup silindi ve sunucu iç adresini çözemiyordu
  # ("Can't reach database server at dpg-…-a", 2026-10-16). Yeni ad,
  # Blueprint'in bu bölgede sıfırdan bir veritabanı açıp DATABASE_URL'i ona
  # bağlaması demek.
  - name: lordlar-vt
    databaseName: lordlar_cagi
    user: lordlar
    plan: free
    # ÖNEMLİ: servisle AYNI bölge. Render'ın iç adresi (dpg-xxxxx-a) yalnız
    # aynı bölgedeki servislerden çözülür (Prisma P1001).
    region: frankfurt
    # `ipAllowList: []` (yalnız iç bağlantı) bilerek YOK: ücretsiz planda
    # kabul edildiği doğrulanamadı ve Blueprint eşitlemesini bozabilirdi.
    # Varsayılan dışarıya açık ama rastgele, uzun bir parolayla korunuyor.

services:
  - type: web
    name: lordlar-cagi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'

      - key: DATABASE_URL
        fromDatabase:
          name: lordlar-vt
          property: connectionString

      # Ücretsiz sunucunun 512 MB'ına sınıflandırıcı sığmıyor (yukarıda).
      - key: RESIM_SINIFLANDIRICI
        value: kapali

      # Render rastgele üretir; kimse (sen dahil) görmek zorunda değil
      - key: JWT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production

      # Arayüzü aynı sunucudan sun
      - key: SERVE_WEB
        value: 'true'

      # Worker'ı API sürecinin içinde çalıştır
      - key: RUN_WORKER
        value: 'true'

      # Açılışta migration'ları uygula ve dünya yoksa aç
      - key: AUTO_MIGRATE
        value: 'true'

      # Oyuncuların ulaşacağı destek adresi (Kullanım Koşulları ve
      # Aydınlatma Metni'nde yayınlanır). Herkese açık bir iletişim yolu
      # olmalı. Render panelinden elle gir.
      - key: DESTEK_EPOSTA
        sync: false

      # İlk açılışta 6 rakip demo lord. Gerçek oyuncuların dünyasında sahte
      # rakip olmasın: kapalı. Tek başına denemek için geçici olarak "true".
      # (Burada `value` olduğu için Blueprint eşitlemesi paneldeki değeri ezer.)
      - key: SEED_DEMO_LORDS
        value: 'false'

      # Hata izleme. Boş bırakılırsa kapalıdır ve dışarıya hiçbir şey gitmez.
      # sentry.io'da ücretsiz proje açıp DSN'i Render panelinden gir.
      - key: SENTRY_DSN
        sync: false

      # info: her isteği değil, olayları yazar. Sorun ararken "debug" yap.
      - key: LOG_LEVEL
        value: info

      # İlk oturum ölçümü (docs/08 İ7). Boş bırakılırsa /api/olcum ucu hiç
      # yüklenmez. Bir değer girersen telefondan da bakabilirsin:
      #   https://<adres>/api/olcum?anahtar=<değer>
      # Oyuncu verisi değil, yalnızca toplamlar döner.
      - key: OLCUM_ANAHTARI
        sync: false

      # E-posta. "log" hiçbir şey göndermez, yalnızca sunucu log'una yazar —
      # parola sıfırlama akışı çalışır ama posta gitmez. Gerçek posta için
      # "resend" yapıp anahtarı ve doğrulanmış gönderen adresini gir.
      - key: EPOSTA_TASIYICI
        value: log
      - key: EPOSTA_ANAHTAR
        sync: false
      - key: EPOSTA_GONDEREN
        sync: false

      # Push bildirimi (docs/05). Yerelde `pnpm push-anahtari` ile bir çift
      # üret, iki yarıyı Render panelinde gir. Boş kalırsa bildirim kapalıdır
      # ve arayüzde düğme hiç çıkmaz. Gizli yarıyı depoya yazma; değiştirmek
      # bütün abonelikleri geçersiz kılar.
      - key: VAPID_ACIK_ANAHTAR
        sync: false
      - key: VAPID_GIZLI_ANAHTAR
        sync: false
      - key: VAPID_ILETISIM
        sync: false

      # UYGULAMA_URL verilmezse Render'ın kendi dış adresi kullanılır;
      # kendi alan adını bağladığında burayı onunla doldur.
      - key: UYGULAMA_URL
        sync: false

      # İstemcinin IP'si (apps/api/src/istemciIp.ts). Render'ın önündeki
      # Cloudflare bu başlığı her istekte kendisi yazıyor; X-Forwarded-For'un
      # başı istemcinin uydurabileceği bir değer. Bu olmadan kayıt/giriş
      # sınırı bütün oyunculara TEK kova olur. Yönetici panosundaki yayın
      # kontrolü ayarın tuttuğunu senin isteğinle ölçer.
      - key: ISTEMCI_IP_BASLIGI
        value: cf-connecting-ip

      # Mağaza (docs/25) — isteğe bağlı; boşsa Mağaza yalnız bilgi gösterir.
      # Google Play satın alma: uygulamanın paket adı ve Play Developer
      # API'ye erişen servis hesabının JSON anahtarı (düz ya da base64).
      # Anahtar GİZLİ: depoya ya da sohbete yazma, yalnız Render panelinde.
      - key: PLAY_PAKET_ADI
        sync: false
      - key: PLAY_SERVIS_HESABI
        sync: false
      # AdMob ödüllü reklam: birim kimliği (ca-app-pub-…/…) ve /app-ads.txt
      # için yayıncı kimliği (pub-…). İkisi de herkese açık değerler.
      - key: ADMOB_ODUL_BIRIMI
        sync: false
      - key: ADMOB_YAYINCI_KIMLIGI
        sync: false

      # Hız sınırları. Genel sınır oturuma, kayıt/giriş IP'ye bağlı.
      - key: RATE_LIMIT_MAX
        value: '300'
      - key: AUTH_RATE_LIMIT_MAX
        value: '60'
