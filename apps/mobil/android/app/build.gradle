apply plugin: 'com.android.application'

/*
 * Lordlar Çağı — Android kabuğu (docs/25).
 *
 * Gizli değerler DEPOYA YAZILMIYOR: imza anahtarı ve parolaları ortam
 * değişkeninden (CI'da gizli değişken) geliyor. Sürüm derlemesi imza ve
 * gerçek AdMob kimliği olmadan DURUYOR (aşağıda); hata ayıklama derlemesi
 * her zaman çalışıyor ve Google'ın test reklamlarını gösteriyor.
 *
 *   SURUM_KODU            Play'e yüklenen her derlemede bir artmalı
 *   SURUM_ADI             oyuncunun gördüğü sürüm (ör. 1.2.0)
 *   ADMOB_UYGULAMA_KIMLIGI  ca-app-pub-…~…  (yoksa Google'ın TEST uygulaması)
 *   IMZA_DOSYASI / IMZA_PAROLASI / IMZA_TAKMA_ADI / IMZA_ANAHTAR_PAROLASI
 */
def ortam = { String ad, String varsayilan -> System.getenv(ad) ?: (project.findProperty(ad) ?: varsayilan) }
// Google'ın herkese açık TEST uygulama kimliği: gerçek reklam göstermez.
def admobTestUygulamasi = 'ca-app-pub-3940256099942544~3347511713'

/*
 * Play'e giden derleme (bundleRelease / assembleRelease) test reklam
 * kimliğiyle ya da imzasız çıkmasın: ikisi de sessizce derlenirdi ve
 * yanlışlık ancak Play Console'da ya da gelir raporunda görünürdü.
 */
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    def eksik = []
    if (!(ortam('ADMOB_UYGULAMA_KIMLIGI', '').toString() ==~ /ca-app-pub-\d+~\d+/)) {
        eksik << 'ADMOB_UYGULAMA_KIMLIGI (ca-app-pub-…~…)'
    }
    if (!ortam('IMZA_DOSYASI', '')) eksik << 'IMZA_DOSYASI ve parolaları'
    if (eksik) {
        throw new GradleException("Sürüm derlemesi için eksik: ${eksik.join(', ')} — docs/25 §4.4")
    }
}

android {
    namespace = "com.lordlarcagi.oyun"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lordlarcagi.oyun"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(ortam('SURUM_KODU', '1'))
        versionName ortam('SURUM_ADI', '1.0.0')
        manifestPlaceholders = [admobUygulamaKimligi: ortam('ADMOB_UYGULAMA_KIMLIGI', admobTestUygulamasi)]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def dosya = ortam('IMZA_DOSYASI', '')
            if (dosya) {
                storeFile file(dosya)
                storePassword ortam('IMZA_PAROLASI', '')
                keyAlias ortam('IMZA_TAKMA_ADI', '')
                keyPassword ortam('IMZA_ANAHTAR_PAROLASI', '')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ortam('IMZA_DOSYASI', '')) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
