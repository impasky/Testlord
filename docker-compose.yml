services:
  postgres:
    image: postgres:16-alpine
    container_name: lordlar-postgres
    environment:
      POSTGRES_USER: lordlar
      POSTGRES_PASSWORD: lordlar
      POSTGRES_DB: lordlar_cagi
    ports:
      - "5432:5432"
    volumes:
      - lordlar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lordlar -d lordlar_cagi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lordlar-pgdata:
